<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudMon</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
</head>
<body class="auth-page">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Memuat CloudMon...</p>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo-large">CloudMon</div>
                <h1>Selamat Datang Kembali</h1>
                <p>Masuk ke akun Anda untuk melanjutkan</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="email@example.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Ingat saya
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-large" id="loginBtn">
                    <span class="btn-text">Masuk</span>
                    <span class="btn-loading hidden">⏳</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Belum punya akun? <a href="/register.html">Daftar di sini</a></p>
                <p><a href="/support.html" class="support-link">Butuh bantuan?</a></p>
            </div>

            <div class="auth-features">
                <div class="feature">
                    <span class="feature-icon">🔗</span>
                    <span>Generate URL File</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⭐</span>
                    <span>URL Custom Premium</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💾</span>
                    <span>Penyimpanan Aman</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="/auth.js"></script>
</body>
</html>
